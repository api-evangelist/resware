apis:
- aid: resware:resware-files-orders-api
  name: ResWare Files & Orders API
  tags:
  - Files
  - Orders
  - Title Production
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.qualia.com/resware/
  properties:
  - url: https://www.qualia.com/resware/
    type: Documentation
  - url: https://www.qualia.com/resware-integrations/
    type: Documentation
  description: Modeled logical service area for creating and managing title/escrow files
    (orders) - the core transaction records that carry file number, property, parties,
    and status through the closing lifecycle. Delivered over ResWare's gated SOAP/XML
    (WCF) partner web services plus REST document endpoints (e.g. /Api/files/search).
    Endpoints modeled from partner integrations; no public API reference is published.
- aid: resware:resware-documents-api
  name: ResWare Documents API
  tags:
  - Documents
  - Document Management
  - Closing Package
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.qualia.com/resware/
  properties:
  - url: https://www.qualia.com/resware/
    type: Documentation
  description: Modeled logical service area for retrieving, uploading, and generating
    documents attached to a file - closing packages, executed documents, and
    auto-generated forms. In partner integrations this is the REST-oriented surface
    (e.g. /Api/files/:file_id/documents) layered on the SOAP/WCF platform. Endpoints
    modeled; no public API reference is published.
- aid: resware:resware-contacts-api
  name: ResWare Contacts API
  tags:
  - Contacts
  - Parties
  - CRM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.qualia.com/resware/
  properties:
  - url: https://www.qualia.com/resware/
    type: Documentation
  description: Modeled logical service area for the people and organizations attached
    to a file - buyers, sellers, lenders, agents, and vendors - and their roles and
    mappings to partner-side identifiers. Delivered over ResWare's gated SOAP/XML (WCF)
    partner web services. Endpoints modeled; no public API reference is published.
- aid: resware:resware-tasks-api
  name: ResWare Tasks API
  tags:
  - Tasks
  - Actions
  - Workflow
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.qualia.com/resware/
  properties:
  - url: https://www.qualia.com/resware/
    type: Documentation
  description: Modeled logical service area for ResWare's action-based tasks and
    multi-directional workflow steps that drive a file through its lifecycle - creating,
    completing, and querying tasks. Delivered over ResWare's gated SOAP/XML (WCF) partner
    web services. Endpoints modeled; no public API reference is published.
- aid: resware:resware-accounting-api
  name: ResWare Accounting API
  tags:
  - Accounting
  - Escrow
  - Reconciliation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.qualia.com/resware/
  properties:
  - url: https://www.qualia.com/resware/
    type: Documentation
  description: Modeled logical service area for escrow accounting - trust ledgers,
    receipts and disbursements, reconciliation, and remittance data tied to a file.
    Delivered over ResWare's gated SOAP/XML (WCF) partner web services. Endpoints
    modeled; no public API reference is published.
- aid: resware:resware-notes-api
  name: ResWare Notes API
  tags:
  - Notes
  - Comments
  - Activity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.qualia.com/resware/
  properties:
  - url: https://www.qualia.com/resware/
    type: Documentation
  description: Modeled logical service area for reading and writing notes and activity
    entries on a file, used by partners to post status updates and messages back into
    ResWare. Delivered over ResWare's gated SOAP/XML (WCF) partner web services, with a
    REST note endpoint observed in some integrations. Endpoints modeled; no public API
    reference is published.
- aid: resware:resware-partners-api
  name: ResWare Partners API
  tags:
  - Partners
  - Integrations
  - Proxy Service
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.qualia.com/resware-integrations/
  properties:
  - url: https://www.qualia.com/resware-integrations/
    type: Documentation
  description: Modeled logical service area for ResWare's partner-integration framework -
    the proxy/partner web-service messages that exchange orders, documents, and status
    with external vendors (signing/RON, recording, search, LOS, wire protection, and
    more). This is the primary SOAP/XML (WCF) integration surface. Endpoints modeled;
    no public API reference is published.
