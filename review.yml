actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. ResWare's integration API is a gated,
    partner-only SOAP/XML (WCF) plus REST surface with no public reference. The
    apis.yml documents the company honestly as a gated provider and models the
    logical service areas (Files/Orders, Documents, Contacts, Tasks, Accounting,
    Notes, Partners) without fabricating a REST surface. No AsyncAPI document was
    created because there is no server-push transport on ResWare's own API and
    the surface is not publicly documented.
